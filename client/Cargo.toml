[package]
name = "metroidvania-rust"
version = "0.1.0"
edition = "2024"

[lib]
name = "metroidvania_rust"
path = "src/lib.rs"

[dependencies]
crossbeam-channel = "0.5.15"
game = { path = "../game" }
glam = "0.27"
laminar = "0.5.0"
macroquad = "0.4.14"
postcard = { version = "1.1.3", features = ["alloc"] }
protocol = { path = "../protocol" }
serde = "1.0.228"
serde_json = "1.0"

[lints]
workspace = true
