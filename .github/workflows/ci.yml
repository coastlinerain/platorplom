name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check --all

      - name: Lint with Clippy
        run: cargo clippy --all-targets --workspace -- -D warnings

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run tests
        # The "headless" client binary still opens a macroquad window (it is the
        # GUI binary behind a `--headless` flag), so the subprocess tests that
        # spawn it (headless_timing, packet_log_rate) need a virtual display.
        run: xvfb-run -a cargo test --workspace
